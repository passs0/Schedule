name: Build & Publish Schedule

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -n "$LATEST_XCODE" ]]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Verify ScheduleCore
        run: swift run ScheduleCoreVerify

      - name: Build Schedule.app with dynamic Icon Composer icon
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create Schedule-macOS.dmg
        run: |
          rm -rf dist/dmg_stage dist/Schedule-macOS.dmg
          mkdir -p dist/dmg_stage
          cp -R dist/Schedule.app dist/dmg_stage/
          ln -s /Applications dist/dmg_stage/Applications
          hdiutil create -volname "Schedule" -srcfolder dist/dmg_stage -ov -format UDZO dist/Schedule-macOS.dmg
          rm -rf dist/dmg_stage

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-macOS-dmg
          path: dist/Schedule-macOS.dmg

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Schedule-macOS.dmg
          generate_release_notes: true
